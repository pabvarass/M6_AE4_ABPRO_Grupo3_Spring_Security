<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Login · M6_AE4_ABPRO - Grupo 3 - Seguridad</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height:100vh;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-8 col-md-6 col-lg-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h4 class="mb-1 text-center">M6_AE4_ABPRO - Grupo 3 - Seguridad</h4>
            <p class="text-center text-muted mb-4">Iniciar sesión</p>

            <div th:if="${param.error}" class="alert alert-danger" role="alert">
              Credenciales inválidas
            </div>
            <div th:if="${param.logout}" class="alert alert-info" role="alert">
              Sesión cerrada correctamente
            </div>

            <form th:action="@{/login}" method="post" class="vstack gap-3">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <div>
                <label class="form-label">Usuario</label>
                <input class="form-control" type="text" name="username" required autofocus>
              </div>
              <div>
                <label class="form-label">Contraseña</label>
                <input class="form-control" type="password" name="password" required>
              </div>
              <button class="btn btn-primary w-100" type="submit">Entrar</button>
            </form>

            <div class="text-center mt-3">
              The demo users: admin/admin123 · pepe/pepe123
            </div>

            <div class="text-center mt-3">
              <a th:href="@{/}" class="text-decoration-none">Volver al inicio</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
