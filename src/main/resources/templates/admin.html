<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/springsecurity">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Admin · M6_AE4_ABPRO - Grupo 3 - Seguridad</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-dark navbar-dark mb-4">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">M6_AE4_ABPRO - Grupo 3 - Seguridad</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#topnav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div id="topnav" class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" th:href="@{/panel}">Panel</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/perfil}">Perfil</a></li>
        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
          <a class="nav-link" th:href="@{/admin}">Admin</a>
        </li>
      </ul>
      <div class="d-flex align-items-center gap-3">
        <span class="navbar-text small" th:text="${#authentication?.name}">usuario</span>
        <form th:action="@{/logout}" method="post" class="m-0">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button class="btn btn-outline-light btn-sm" type="submit">Salir</button>
        </form>
      </div>
    </div>
  </div>
</nav>  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">
        <div class="card shadow-sm">
          <div class="card-body">
            <h4 class="card-title mb-3">Panel de administración</h4>
            <p>Hola, <b th:text="${usuario}">admin</b> (solo ADMIN)</p>
            <p>Roles: <span th:text="${roles}">[ROLE_ADMIN]</span></p>
            <div class="alert alert-warning" role="alert">
              Esta sección está protegida para el rol ADMIN.
            </div>
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/panel}">Volver al panel</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
